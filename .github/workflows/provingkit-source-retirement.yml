name: Provingkit source retirement

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: Validate retired Provingkit routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Validate the fresh-clone retirement boundary
        run: |
          python -m unittest tests.test_validate_provingkit_retirement
          python scripts/validate_provingkit_retirement.py .

  required:
    name: Provingkit retirement gate
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Check required job results
        if: ${{ always() }}
        shell: sh
        working-directory: .
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          printf 'Needed job results: %s\n' "$NEEDS_RESULTS"
          remaining=$NEEDS_RESULTS
          while :; do
            case "$remaining" in
              success) exit 0 ;;
              success,*) remaining=${remaining#*,} ;;
              *) exit 1 ;;
            esac
          done
