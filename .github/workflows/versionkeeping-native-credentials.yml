name: Versionkeeping native credential providers

on:
  pull_request:
  push:

concurrency:
  group: versionkeeping-native-credentials-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-credential-provider:
    name: ${{ matrix.os }} credential provider
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install the pinned Git Credential Manager package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcm_package="$RUNNER_TEMP/gcm-linux-x64-2.9.1.deb"
          curl --fail --location --silent --show-error \
            --output "$gcm_package" \
            https://github.com/git-ecosystem/git-credential-manager/releases/download/v2.9.1/gcm-linux-x64-2.9.1.deb
          echo "a0c59d2ea873a930fd1c41031a25cb31055d31baaf80c10726847e1c1f7aa951  $gcm_package" \
            | sha256sum --check --strict
          sudo dpkg --install "$gcm_package"
          sudo apt-get update
          sudo apt-get install --yes dbus-daemon gnome-keyring libglib2.0-bin

      - name: Verify the Linux credential-provider boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          runtime_dir="$RUNNER_TEMP/versionkeeping-runtime"
          test_home="$RUNNER_TEMP/versionkeeping-home"
          install --directory --mode=0700 "$runtime_dir" "$test_home"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export HOME="$test_home"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          dbus_pid="$(dbus-daemon --session --fork \
            --address="$DBUS_SESSION_BUS_ADDRESS" --print-pid)"
          trap 'kill "$dbus_pid"' EXIT
          printf '\n' | gnome-keyring-daemon --unlock --components=secrets
          python -m unittest \
            tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_linux_gcm_provider_is_trusted_and_executable

      - name: Verify the macOS or Windows credential-provider boundary
        if: runner.os != 'Linux'
        run: >-
          python -m unittest
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_macos_osxkeychain_provider_is_trusted
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_windows_gcm_provider_is_trusted_and_executable
