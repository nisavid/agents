name: Versionkeeping native credential providers

on:
  pull_request:
  push:

concurrency:
  group: versionkeeping-native-credentials-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-credential-provider:
    name: ${{ matrix.os }} credential provider
    runs-on: ${{ matrix.os }}
    env:
      VERSIONKEEPING_REQUIRE_NATIVE_CREDENTIAL_ROUNDTRIP: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify the Linux credential-provider boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test_home="$RUNNER_TEMP/versionkeeping-home"
          install --directory --mode=0700 "$test_home"
          export HOME="$test_home"
          trap 'git credential-cache exit || true' EXIT
          python -m unittest \
            tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_linux_credential_cache_is_trusted_and_executable \
            tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_provider_authenticates_https_and_is_erased

      - name: Verify the macOS or Windows credential-provider boundary
        if: runner.os != 'Linux'
        run: >-
          python -m unittest
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_macos_osxkeychain_provider_is_trusted
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_windows_gcm_provider_is_trusted_and_executable
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_provider_authenticates_https_and_is_erased
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_windows_acl_probe_rejects_a_user_writable_path
