name: Versionkeeping native credential providers

on:
  pull_request:
  push:

concurrency:
  group: versionkeeping-native-credentials-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-credential-provider:
    name: ${{ matrix.os }} credential provider
    runs-on: ${{ matrix.os }}
    env:
      VERSIONKEEPING_REQUIRE_NATIVE_CREDENTIAL_ROUNDTRIP: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify the Linux credential-provider boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test_home="$RUNNER_TEMP/versionkeeping-home"
          install --directory --mode=0700 "$test_home"
          export HOME="$test_home"
          trap 'git credential-cache exit || true' EXIT
          python -m unittest \
            tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_linux_credential_cache_is_trusted_and_executable \
            tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_provider_authenticates_https_and_is_erased

      - name: Verify the macOS or Windows credential-provider boundary
        if: runner.os != 'Linux'
        run: >-
          python -m unittest
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_macos_osxkeychain_provider_is_trusted
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_windows_gcm_provider_is_trusted_and_executable
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_system_provider_authenticates_https_and_is_erased
          tests.plugins.versionkeeping.checkpointing-and-publishing-git-work.test_git_publication_execution.PublicationExecutionTests.test_windows_acl_probe_rejects_a_user_writable_path

      - name: Report native trust inputs after a failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          scripts = Path.cwd() / "plugins/versionkeeping/skills/checkpointing-and-publishing-git-work/scripts"
          sys.path.insert(0, str(scripts))
          import git_publication.adapter as adapter

          print(f"platform={sys.platform}")
          if sys.platform == "win32":
              roots = adapter._windows_git_install_roots()
              print(f"registered={adapter._windows_registered_git_roots()}")
              print(f"program_files={adapter._windows_machine_program_files_roots()}")
              print(f"admitted={roots}")
              for root in roots:
                  for name, relative in adapter.WINDOWS_GIT_RUNTIME.items():
                      path = root / relative
                      try:
                          adapter._trusted_windows_bundled_executable(path, root)
                          result = "trusted"
                      except OSError as error:
                          result = repr(error)
                      print(f"{name}={path} result={result}")
                  try:
                      result = adapter._windows_trusted_command_path(root)
                  except OSError as error:
                      result = repr(error)
                  print(f"command_path={result}")
          elif sys.platform.startswith("linux"):
              for path in (
                  Path(os.popen("git --exec-path").read().strip())
                  / adapter.LINUX_CREDENTIAL_HELPER,
                  Path("/usr/bin") / adapter.LINUX_CREDENTIAL_HELPER,
              ):
                  details = "unavailable"
                  try:
                      metadata = path.lstat()
                      details = (
                          f"uid={metadata.st_uid} mode={stat.S_IMODE(metadata.st_mode):o} "
                          f"symlink={path.is_symlink()} resolved={path.resolve(strict=True)}"
                      )
                      adapter._trusted_root_owned_executable(
                          path,
                          allowed_path=adapter.TRUSTED_HELPER_PATH_RE,
                          reject_set_id=True,
                          allow_root_owned_symlink=True,
                      )
                      result = "trusted"
                  except OSError as error:
                      result = repr(error)
                  print(f"candidate={path} {details} result={result}")
          PY

      - name: Report Windows ACL inputs after a failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = 'C:\Program Files\Git'
          $paths = @(
            'C:\',
            'C:\Program Files',
            $root,
            "$root\cmd",
            "$root\cmd\git.exe",
            "$root\usr",
            "$root\usr\bin",
            "$root\usr\bin\ssh.exe"
          )
          foreach ($path in $paths) {
            $acl = Get-Acl -LiteralPath $path
            Write-Output "path=$path owner=$($acl.Owner)"
            foreach ($ace in $acl.Access) {
              try {
                $sid = $ace.IdentityReference.Translate(
                  [System.Security.Principal.SecurityIdentifier]
                ).Value
              } catch {
                $sid = $ace.IdentityReference.Value
              }
              Write-Output (
                "sid=$sid type=$($ace.AccessControlType) " +
                "rights=$($ace.FileSystemRights) " +
                "inheritance=$($ace.InheritanceFlags) " +
                "propagation=$($ace.PropagationFlags) inherited=$($ace.IsInherited)"
              )
            }
          }
